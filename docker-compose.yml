services:
  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in the root .env file}
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - identity
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak  # gitleaks:allow (JDBC URL, no secret)
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in the root .env file}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in the root .env file}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm8export.json:/opt/keycloak/data/import/aga-airport-realm.json:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    networks:
      - identity
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  rag:
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    env_file:
      - path: ./rag_service/.env
        required: false
    environment:
      CHROMA_PERSIST_DIR: /app/backend/chroma_data
      RAG_LOCAL_FILES_ONLY: "false"
    volumes:
      - ./backend/chroma_data:/app/backend/chroma_data
      - ./rag_service/data/pdfs:/app/rag_service/data/pdfs
      - type: bind
        source: ${HF_CACHE_DIR:-${USERPROFILE}/.cache/huggingface/hub}
        target: /root/.cache/huggingface/hub
        read_only: true
    expose:
      - "8002"
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

  api:
    build:
      context: ./backend/api_service
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
      - path: ./backend/api_service/.env
        required: false
    environment:
      AUTH_DISABLED: "false"
      RAG_SERVICE_URL: http://rag:8002
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      KEYCLOAK_ISSUER_URL: http://localhost:8081/realms/aga-airport
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/aga-airport/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: aga-api
    ports:
      - "8001:8001"
    networks:
      - edge
      - backend
      - identity
    depends_on:
      rag:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=5)
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
        VITE_API_BASE_URL: http://localhost:8001
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: aga-airport
        VITE_KEYCLOAK_CLIENT_ID: aga-web
    ports:
      - "8080:80"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
  backend:
  identity:

volumes:
  keycloak_db_data:
